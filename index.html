<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RACI Matrix — Admin</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Inter font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="styles.css" />

    <script type="module" src="raci-service.js"></script>
    <script type="module" src="raci-ui.js"></script>
    <script type="module" src="app.js"></script>
    <script type="module" src="your-work.js"></script>
  </head>

  <body data-view="dashboard">
    <div class="app-shell d-flex">
      <!-- SIDEBAR -->
      <aside class="sidebar p-3 d-flex flex-column" id="sidebar">
        <div class="brand mb-3 d-flex align-items-center gap-3">
          <div class="logo"><i class="fa-solid fa-diagram-project"></i></div>
          <div class="brand-text">
            <h4 class="mb-0">RACI<span>Matrix</span></h4>
            <div class="small-muted" style="font-size: 12px">
              Monthly task assignment
            </div>
          </div>
        </div>

        <div class="divider mb-2"></div>

        <nav class="nav flex-column mb-3" id="main-nav">
          <a class="nav-link active" href="#" data-view="dashboard">
            <i class="fa-solid fa-gauge"></i
            ><span class="label"> Dashboard</span>
          </a>

          <a class="nav-link" href="#" data-view="manage">
            <i class="fa-solid fa-gear"></i
            ><span class="label"> Manage RACI</span>
          </a>

          <a class="nav-link" href="#" data-view="users">
            <i class="fa-solid fa-users"></i><span class="label"> Users</span>
          </a>

          <a class="nav-link" href="#" data-view="your-work">
            <i class="fa-solid fa-briefcase"></i
            ><span class="label"> Your Work</span>
          </a>

          <a class="nav-link" href="#" data-view="reports">
            <i class="fa-solid fa-chart-line"></i
            ><span class="label"> Reports</span>
          </a>

          <a class="nav-link" href="#" data-view="about">
            <i class="fa-solid fa-info-circle"></i
            ><span class="label"> What is RACI?</span>
          </a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main flex-fill p-0">
        <div class="p-md-3">
          <div
            class="topbar d-flex justify-content-between align-items-center mb-3"
          >
            <div class="d-flex align-items-center gap-3">
              <button
                id="btn-toggle-sidebar"
                class="btn btn-outline-secondary btn-sm"
              >
                <i class="fa fa-bars"></i>
              </button>

              <div>
                <h2 id="view-title" class="mb-0">Dashboard</h2>
                <div id="view-sub" class="text-muted small">
                  RACI overview for selected month
                </div>
              </div>
            </div>

            <div class="d-flex align-items-center gap-2">
              <div class="input-group search d-none d-md-flex"></div>

              <div class="d-flex align-items-center gap-2">
                <label class="small text-muted mb-0">Month</label>
                <input
                  id="monthPicker"
                  type="month"
                  class="form-control form-control-sm"
                />
                <button
                  id="btn-add-task-top"
                  class="btn btn-primary btn-sm d-none"
                >
                  + Add Task
                </button>
              </div>
            </div>
          </div>

          <!-- Stats -->
          <div class="stats-row mb-3 d-flex gap-2 flex-wrap">
            <div class="stat-card">
              <div class="label small-muted">Tasks</div>
              <div id="stat-tasks" class="value">0</div>
            </div>
            <div class="stat-card">
              <div class="label small-muted">Wings</div>
              <div id="stat-wings" class="value">0</div>
            </div>
            <div class="stat-card">
              <div class="label small-muted">Users</div>
              <div id="stat-users" class="value">0</div>
            </div>
            <div class="stat-card">
              <div class="label small-muted">Active Month</div>
              <div id="stat-month" class="value">—</div>
            </div>
          </div>

          <!-- view container (templates render here) -->
          <div id="view-container"></div>
        </div>
      </main>
    </div>

    <!-- TEMPLATES -->

    <!-- DASHBOARD -->
    <template id="dashboard-tpl">
      <div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">RACI Matrix (read-only)</h5>
          <div class="d-flex gap-2">
            <select id="filterWing" class="form-select form-select-sm"></select>
            <select
              id="filterSubwing"
              class="form-select form-select-sm"
            ></select>
            <button id="clearFilters" class="btn btn-sm btn-outline-secondary">
              Clear
            </button>
            <button
              id="dashboard-export"
              class="btn btn-sm btn-outline-success"
            >
              Export CSV
            </button>
          </div>
        </div>

        <div id="dashboardArea"></div>
      </div>
    </template>

    <!-- MANAGE -->
    <template id="manage-tpl">
      <div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Manage RACI</h3>
          <div>
            <button id="btn-new-task" class="btn btn-primary btn-sm">
              + New Task
            </button>
          </div>
        </div>

        <div class="card p-3 mb-3">
          <div class="row g-2 align-items-center">
            <div class="col-md-4">
              <label class="form-label small mb-1">Wing</label>
              <select
                id="manage-filter-wing"
                class="form-select form-select-sm"
              ></select>
            </div>
            <div class="col-md-4">
              <label class="form-label small mb-1">Subwing</label>
              <select
                id="manage-filter-subwing"
                class="form-select form-select-sm"
              ></select>
            </div>
            <div class="col-md-4 text-end">
              <label class="form-label small mb-1 invisible">actions</label>
              <button
                id="manage-clear-filters"
                class="btn btn-sm btn-outline-secondary"
              >
                Clear
              </button>
            </div>
          </div>
        </div>

        <div id="manageArea"></div>
      </div>
    </template>

    <!-- WINGS -->
    <template id="wings-tpl">
      <div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Wings & Subwings</h3>
          <div>
            <button id="btn-add-wing" class="btn btn-primary btn-sm">
              + Add Wing
            </button>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-5">
            <div class="card p-3">
              <h6>All Wings</h6>
              <div id="wingsList" class="list-group mt-2"></div>
            </div>
          </div>

          <div class="col-md-7">
            <div class="card p-3">
              <h6>Subwings (selected wing)</h6>
              <div id="subwingsList" class="list-group mt-2"></div>
              <div class="mt-3 d-flex gap-2">
                <input
                  id="newSubwingName"
                  class="form-control form-control-sm"
                  placeholder="New subwing name"
                />
                <button
                  id="btn-add-subwing"
                  class="btn btn-sm btn-outline-primary"
                >
                  Add
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- USERS -->
    <template id="users-tpl">
      <div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Users</h3>
        </div>

        <div class="row g-3 flex-column-reverse flex-lg-row">
          <div class="col-md-4">
            <input
              id="searchUser"
              class="form-control form-control-sm mb-2"
              placeholder="Search name or employee ID"
            />
            <select id="userFilterWing" class="form-select form-select-sm mb-2">
              <option value="">All Wings</option>
            </select>
            <div id="usersList" class="list-group"></div>
          </div>

          <div class="col-md-8">
            <div id="userDetail" class="border rounded p-3 bg-light">
              <div class="text-muted">
                Select a user to view assignments for the selected month
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- REPORTS -->
    <template id="reports-tpl">
      <div>
        <div class="d-flex gap-2 align-items-center mb-3">
          <input
            id="reportMonth"
            type="month"
            class="form-control form-control-sm w-auto"
          />
          <button id="btn-generate-report" class="btn btn-primary btn-sm">
            Generate
          </button>
          <button id="btn-export-report" class="btn btn-outline-success btn-sm">
            Export CSV
          </button>
        </div>
        <div id="reportResult"></div>
      </div>
    </template>

    <!-- PHASE & ROW (order: Task, R, A, C, I, Status, Deadline, Actions) -->
    <template id="phase-tpl">
      <div class="project-phase mb-3">
        <div class="d-flex align-items-center">
          <div class="phase-accent"></div>
          <div class="ms-3">
            <div class="fw-semibold phase-name"></div>
            <div class="small text-muted phase-meta"></div>
          </div>
        </div>

        <div class="mt-3 matrix-table">
          <div class="matrix-row matrix-head">
            <div class="task-col">Task / Deliverable</div>
            <div class="role-col">Responsible (R)</div>
            <div class="role-col">Accountable (A)</div>
            <div class="role-col">Consulted (C)</div>
            <div class="role-col">Informed (I)</div>
            <div class="status-col">Status</div>
            <div class="deadline-col">Deadline</div>
            <div class="actions-col">Actions</div>
          </div>

          <div class="matrix-rows mt-2"></div>
        </div>
      </div>
    </template>

    <template id="row-tpl">
      <div class="matrix-row matrix-item">
        <!-- Task column -->
        <div class="task-col">
          <div class="fw-semibold row-title"></div>
          <!-- keep small meta here if required, but actual status is in status-col -->
        </div>

        <!-- Roles -->
        <div class="role-col role-r"></div>
        <div class="role-col role-a"></div>
        <div class="role-col role-c"></div>
        <div class="role-col role-i"></div>

        <!-- Status column (JS uses .row-meta here) -->
        <div class="status-col">
          <div class="small text-muted row-meta"></div>
        </div>

        <!-- Deadline -->
        <div class="deadline-col"></div>

        <!-- Actions (always last) -->
        <div class="actions-col"></div>
      </div>
    </template>

    <!-- TASK MODAL -->
    <div class="modal fade" id="modal-task" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form id="form-task" class="p-3">
            <input type="hidden" id="task-id" />
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label small">Wing</label>
                <select id="task-wing" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label small">Subwing</label>
                <select id="task-subwing" class="form-select" required></select>
              </div>

              <div class="col-12">
                <label class="form-label small">Task / Deliverable</label>
                <input
                  id="task-title"
                  class="form-control"
                  placeholder="Task title"
                  required
                />
              </div>

              <div class="col-md-4">
                <label class="form-label small">Deadline</label>
                <input id="task-deadline" type="date" class="form-control" />
              </div>

              <div class="col-md-4">
                <label class="form-label small">Status</label>
                <select id="task-status" class="form-select">
                  <option>Not Started</option>
                  <option>In Progress</option>
                  <option>Completed</option>
                  <option>Overdue</option>
                  <option>On Hold</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label small">Assign R / A / C / I</label>
                <div class="d-flex gap-2 mt-1">
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-raci"
                    data-role="responsible"
                  >
                    R
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-raci"
                    data-role="accountable"
                  >
                    A
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-raci"
                    data-role="consulted"
                  >
                    C
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-raci"
                    data-role="informed"
                  >
                    I
                  </button>
                </div>
                <div id="task-raci-preview" class="mt-2 small text-muted"></div>
              </div>

              <div class="col-12 text-end mt-2">
                <button
                  type="button"
                  class="btn btn-outline-secondary me-2"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button type="submit" class="btn btn-primary">Save Task</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- SELECT USERS MODAL -->
    <div class="modal fade" id="modal-select-user" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              Select users for <span id="select-role-label"></span>
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input
              id="select-search"
              class="form-control form-control-sm mb-2"
              placeholder="Search users..."
            />
            <div id="select-user-list" class="list-group"></div>
          </div>
          <div class="modal-footer">
            <button
              id="select-user-clear"
              class="btn btn-sm btn-outline-secondary"
            >
              Clear
            </button>
            <button id="select-user-save" class="btn btn-sm btn-primary">
              Done
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap scripts and app -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
